apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
spec:
  type: ClusterIP
  selector:
    app: nginx-lab
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-port
spec:
  type: NodePort
  selector:
    app: nginx-lab
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30100
