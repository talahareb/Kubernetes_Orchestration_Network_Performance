apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-stress
  template:
    metadata:
      labels:
        app: cpu-stress
    spec:
      containers:
        - name: stress
          image: busybox:1.36
          command: ['/bin/sh', '-c']
          args: ['while :; do :; done']
          resources:
            requests:
              cpu: 150m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
